<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b18" />
    <title>DEVTech · Technician Registration</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/technician/main.css') }}" />
</head>
<body class="tech-login-page">

<main class="tech-login-card tech-login-card--wide">
    <div class="tech-login-brand">
        <div class="tech-login-mark"><i class="fas fa-user-plus"></i></div>
        <h1>DEV<span>Tech</span></h1>
        <p>Create your technician account</p>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="tech-login-error is-shown">
        <i class="fas fa-circle-exclamation"></i>
        <span>{{ messages[0] }}</span>
    </div>
    {% endif %}
    {% endwith %}

    <form id="registerForm" method="POST"
          action="{{ url_for('technician.register') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="tech-field">
            <label class="tech-label" for="fullname">
                Full Name <span class="req">*</span>
            </label>
            <input class="tech-input" id="fullname" name="fullname"
                   type="text" placeholder="e.g. Juan Dela Cruz"
                   value="{{ form.fullname or '' }}" required />
        </div>

        <div class="tech-field">
            <label class="tech-label" for="email">
                Email Address <span class="req">*</span>
            </label>
            <input class="tech-input" id="email" name="email"
                   type="email" placeholder="juan@email.com"
                   value="{{ form.email or '' }}" required />
        </div>

        <div class="tech-field">
            <label class="tech-label" for="staffId">
                Staff / Tech ID Number <span class="req">*</span>
            </label>
            <input class="tech-input tech-input--mono" id="staffId" name="staffId"
                   type="text" placeholder="TECH-0002" maxlength="12"
                   value="{{ form.staffId or '' }}" required />
            <p class="tech-hint">Format: <code>TECH-0001</code>.</p>
        </div>

        <div class="tech-grid-2">
            <div class="tech-field">
                <label class="tech-label" for="gender">
                    Gender <span class="req">*</span>
                </label>
                <select class="tech-select" id="gender" name="gender"
                        style="width:100%;" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="tech-field">
                <label class="tech-label" for="dob">
                    Date of Birth <span class="req">*</span>
                </label>
                <input class="tech-input" id="dob" name="dob" type="date"
                       value="{{ form.dob or '' }}" required />
            </div>
        </div>

        <div class="tech-field">
            <label class="tech-label" for="password">
                Password <span class="req">*</span>
            </label>
            <div class="tech-password-wrap">
                <input class="tech-input" id="password" name="password"
                       type="password" placeholder="At least 8 characters"
                       minlength="8" required />
                <button type="button" class="tech-password-toggle"
                        data-target="password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="tech-pw-meter" id="pwMeter">
                <div class="tech-pw-bar"><span></span></div>
                <span class="tech-pw-label" id="pwLabel">Enter a password</span>
            </div>
        </div>

        <div class="tech-field">
            <label class="tech-label" for="password2">
                Confirm Password <span class="req">*</span>
            </label>
            <div class="tech-password-wrap">
                <input class="tech-input" id="password2" name="password2"
                       type="password" required />
                <button type="button" class="tech-password-toggle"
                        data-target="password2">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <label class="tech-check" style="margin-bottom:1.1rem;">
            <input type="checkbox" name="terms" required />
            <span>I confirm the information above is correct.</span>
        </label>

        <button type="submit" class="tech-btn tech-btn--primary tech-btn--wide">
            <i class="fas fa-user-plus"></i> Create Account
        </button>
    </form>

    <div class="tech-login-note">
        Already have an account?
        <a href="{{ url_for('technician.login') }}"
           style="color:var(--t-accent); font-weight:600;">Sign in here</a>
    </div>
</main>

<script>
    // Show / hide password
    document.querySelectorAll('.tech-password-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.dataset.target);
            if (!input) return;
            var isPw = input.type === 'password';
            input.type = isPw ? 'text' : 'password';
            btn.querySelector('i').className = isPw
                ? 'fas fa-eye-slash'
                : 'fas fa-eye';
        });
    });

    // Password strength meter
    var pw = document.getElementById('password');
    var meter = document.getElementById('pwMeter');
    var label = document.getElementById('pwLabel');

    pw.addEventListener('input', function () {
        var v = pw.value;
        if (!v) {
            meter.removeAttribute('data-tone');
            label.textContent = 'Enter a password';
            return;
        }
        var score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        var tones = ['weak', 'fair', 'good', 'strong'];
        var names = ['Weak', 'Fair', 'Good', 'Strong'];
        meter.setAttribute('data-tone', tones[Math.min(score, 3)]);
        label.textContent = names[Math.min(score, 3)];
    });
</script>
</body>
</html>
