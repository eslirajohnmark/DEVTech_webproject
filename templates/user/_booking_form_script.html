<!-- Leaflet is loaded by the page (static/vendor/leaflet) before this script -->
<script>
(function () {
    // Own scope: user.js defines generic functions/variables with the same names.
    // ============================================
    // TIME SLOT BOOKING SYSTEM
    // Max 5 bookings per time slot
    // ============================================

    let bookedSlots = {};
    let bookedCounts = {};
    let currentSelectedDate = '';
    let map = null;
    let marker = null;
    let bookingMapInitialized = false;
    let isLocationValid = false;

    // Tacloban City boundary and isInsideTacloban(lat, lng) are provided
    // by user.js (loaded via the base template) - real 138-barangay data
    // instead of the hand-drawn rectangle/polygon this page used to
    // define locally. That old copy was actually only checking a crude
    // rectangular bounding box, not even the polygon it drew on the map,
    // which could wrongly accept points well outside the actual city
    // shape or reject legitimate ones near its edges.

    // ============================================
    // SUBMIT BUTTON CONTROLS
    // ============================================

    function updateSubmitButtons() {
        const inShop = document.getElementById('inShopCheck').checked;
        const isValid = document.getElementById('isValidLocation').value === '1';
        const submitBtn = document.getElementById('submitBtn');
        const summarySubmitBtn = document.getElementById('summarySubmitBtn');
        const submitWarning = document.getElementById('submitWarning');
        
        // For in-shop repair, always allow submission
        if (inShop) {
            submitBtn.disabled = false;
            summarySubmitBtn.disabled = false;
            submitWarning.style.display = 'none';
            return;
        }
        
        // For home service, check if location is valid
        if (isValid) {
            submitBtn.disabled = false;
            summarySubmitBtn.disabled = false;
            submitWarning.style.display = 'none';
        } else {
            submitBtn.disabled = true;
            summarySubmitBtn.disabled = true;
            submitWarning.style.display = 'block';
        }
    }

    // ============================================
    // TOAST NOTIFICATION
    // ============================================

    function showUserToast(message, type = 'info', duration = 4000) {
        let container = document.getElementById('toastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 10000;
                display: flex;
                flex-direction: column;
                gap: 10px;
                max-width: 400px;
                width: 100%;
                pointer-events: none;
            `;
            document.body.appendChild(container);
        }
        
        const toast = document.createElement('div');
        toast.style.cssText = `
            pointer-events: auto;
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            border-left: 4px solid ${type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : type === 'warning' ? '#f59e0b' : '#2563eb'};
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #0f172a;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: 100%;
        `;
        
        const icons = {
            'success': 'fa-check-circle',
            'error': 'fa-exclamation-circle',
            'warning': 'fa-exclamation-triangle',
            'info': 'fa-info-circle'
        };
        
        const colors = {
            'success': '#22c55e',
            'error': '#ef4444',
            'warning': '#f59e0b',
            'info': '#2563eb'
        };
        
        toast.innerHTML = `
            <i class="fas ${icons[type] || 'fa-info-circle'}" style="color: ${colors[type] || '#2563eb'}; font-size: 1.2rem;"></i>
            <span style="flex:1;">${message}</span>
            <button onclick="this.parentElement.remove()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1.2rem; padding:0 4px;">&times;</button>
        `;
        
        container.appendChild(toast);
        
        requestAnimationFrame(() => {
            toast.style.transform = 'translateX(0)';
        });
        
        setTimeout(() => {
            toast.style.transform = 'translateX(120%)';
            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 400);
        }, duration);
    }

    // ============================================
    // GEOFENCING - TACLOBAN CITY CHECK
    // isInsideTacloban(lat, lng) is defined in user.js, backed by real
    // barangay boundary data.
    // ============================================

    function updateLocationStatus(isValid) {
        const pinResult = document.getElementById('mapPinResult');
        const pinText = document.getElementById('pinResultText');
        const boundaryWarning = document.getElementById('boundaryWarning');
        const locationValid = document.getElementById('locationValid');
        
        if (isValid) {
            pinResult.classList.add('show', 'valid');
            pinResult.classList.remove('invalid');
            boundaryWarning.classList.remove('show');
            locationValid.classList.add('show');
            document.getElementById('isValidLocation').value = '1';
            isLocationValid = true;
            showUserToast('Location pinned inside Tacloban City. Drag the pin to adjust it.', 'success');
        } else {
            pinResult.classList.add('show', 'invalid');
            pinResult.classList.remove('valid');
            boundaryWarning.classList.add('show');
            locationValid.classList.remove('show');
            document.getElementById('isValidLocation').value = '0';
            isLocationValid = false;
            showUserToast('❌ Location is outside Tacloban City. Please select a location within the city boundary.', 'error');
        }
        
        // Update submit buttons
        updateSubmitButtons();
    }

    // ============================================
    // FETCH BOOKED SLOTS
    // ============================================

    function fetchBookedSlots(date) {
        return fetch(`/api/booked-slots?date=${date}`)
            .then(response => response.json())
            .then(data => {
                if (data.booked_slots) {
                    bookedSlots[date] = data.booked_slots;
                    bookedCounts[date] = {};
                    data.booked_slots.forEach(time => {
                        bookedCounts[date][time] = (bookedCounts[date][time] || 0) + 1;
                    });
                }
                return data;
            })
            .catch(error => {
                console.error('Error fetching booked slots:', error);
                bookedSlots[date] = [];
                bookedCounts[date] = {};
                return { booked_slots: [] };
            });
    }

    function getBookedCount(date, time) {
        if (!date || !time) return 0;
        if (bookedCounts[date] && bookedCounts[date][time]) {
            return bookedCounts[date][time];
        }
        return 0;
    }

    function isSlotBooked(date, time) {
        return getBookedCount(date, time) >= 5;
    }

    function isSlotPast(date, time) {
        const now = new Date();
        const slotDate = new Date(date + 'T' + time + ':00');
        return slotDate < now;
    }

    // ============================================
    // UPDATE TIME SLOTS
    // ============================================

    function updateTimeSlots(date) {
        if (!date) {
            resetTimeSlotsToDefault();
            return;
        }

        currentSelectedDate = date;
        const timeSlots = document.querySelectorAll('.user-time-slot');
        let hasAvailableSlot = false;
        let totalSlots = 0;
        let fullyBookedCount = 0;

        timeSlots.forEach(slot => {
            if (slot.classList.contains('lunch')) {
                return;
            }

            totalSlots++;
            const time = slot.dataset.time;
            const count = getBookedCount(date, time);
            const isFull = count >= 5;
            const isPast = isSlotPast(date, time);

            slot.classList.remove('booked', 'available', 'selected', 'past');

            if (isPast) {
                slot.classList.add('past');
                slot.innerHTML = `
                    <span>${slot.querySelector('span:first-child')?.textContent || time}</span>
                    <span class="user-slot-badge past-badge">⏰ Passed</span>
                `;
            } else if (isFull) {
                slot.classList.add('booked');
                slot.innerHTML = `
                    <span>${slot.querySelector('span:first-child')?.textContent || time}</span>
                    <span class="user-slot-badge booked-badge">Full (${count}/5)</span>
                `;
                fullyBookedCount++;
            } else {
                slot.classList.add('available');
                slot.innerHTML = `
                    <span>${slot.querySelector('span:first-child')?.textContent || time}</span>
                    <span class="user-slot-badge available-badge">${count}/5 booked</span>
                `;
                hasAvailableSlot = true;
            }

            if (slot.classList.contains('selected') && (isFull || isPast)) {
                slot.classList.remove('selected');
                document.getElementById('bookingTime').value = '';
            }
        });

        updateAvailabilityStatus(date, hasAvailableSlot, totalSlots, fullyBookedCount);
    }

    function resetTimeSlotsToDefault() {
        const timeSlots = document.querySelectorAll('.user-time-slot');
        const availabilityStatus = document.getElementById('availabilityStatus');

        timeSlots.forEach(slot => {
            if (slot.classList.contains('lunch')) {
                return;
            }
            const time = slot.dataset.time;
            slot.classList.remove('booked', 'available', 'selected', 'past');
            slot.classList.add('available');
            slot.innerHTML = `
                <span>${slot.querySelector('span:first-child')?.textContent || time}</span>
                <span class="user-slot-badge available-badge">Available</span>
            `;
        });

        availabilityStatus.className = 'user-availability-text default';
        availabilityStatus.innerHTML = `<i class="fas fa-info-circle"></i> Select a date to check availability`;
    }

    function updateAvailabilityStatus(date, hasAvailable, totalSlots, fullyBookedCount) {
        const availabilityStatus = document.getElementById('availabilityStatus');
        const availableSlots = totalSlots - fullyBookedCount;

        if (hasAvailable) {
            availabilityStatus.className = 'user-availability-text has-slots';
            availabilityStatus.innerHTML = `
                <i class="fas fa-check-circle"></i> 
                <strong>${availableSlots}</strong> slot(s) available for ${formatDate(date)}
                ${fullyBookedCount > 0 ? ` (${fullyBookedCount} fully booked)` : ''}
            `;
        } else {
            availabilityStatus.className = 'user-availability-text no-slots';
            availabilityStatus.innerHTML = `
                <i class="fas fa-exclamation-circle"></i> 
                All slots are fully booked for ${formatDate(date)}. Please select another date.
            `;
        }
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        return date.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        });
    }

    // ============================================
    // PAYMENT METHOD
    // ============================================

    function updatePaymentInfo() {
        const qrRadio = document.getElementById('payment-qr');
        const paymentInfoText = document.getElementById('paymentInfoText');
        const paymentSummary = document.getElementById('summaryPayment');
        
        if (qrRadio && qrRadio.checked) {             // no QR option while online payments are off
            paymentInfoText.textContent = "After booking, open Transactions and choose Pay by QR. Scan the code with GCash, Maya or your bank's app; the payment is confirmed automatically.";
            paymentSummary.textContent = 'QR Ph';
        } else {
            paymentInfoText.textContent = 'C.A.R (Cash After Repair) - You pay after the repair is completed and you are satisfied with the service.';
            paymentSummary.textContent = 'C.A.R';
        }
    }

    // ============================================
    // MAP FUNCTIONALITY WITH GEOFENCING
    // ============================================

    function initMap() {
        if (bookingMapInitialized) return;
        
        const defaultLat = 11.2444;
        const defaultLng = 125.0039;
        
        map = L.map('locationMap', {maxBounds: TACLOBAN_MAX_BOUNDS, maxBoundsViscosity: 0.8, minZoom: 11})
            .setView([defaultLat, defaultLng], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Tacloban City's real outline (PSA barangays merged), drawn like Google Maps.
        drawTaclobanBoundary(map);
        
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            if (isInsideTacloban(lat, lng)) {
                placeMarker(lat, lng);
            } else {
                // Show invalid location
                const pinResult = document.getElementById('mapPinResult');
                const pinText = document.getElementById('pinResultText');
                pinResult.classList.add('show', 'invalid');
                pinResult.classList.remove('valid');
                pinText.textContent = '❌ Location is outside Tacloban City';
                document.getElementById('boundaryWarning').classList.add('show');
                document.getElementById('isValidLocation').value = '0';
                isLocationValid = false;
                updateSubmitButtons();
                showUserToast('❌ Location is outside Tacloban City. Please select a location within the city boundary.', 'error');
            }
        });
        
        bookingMapInitialized = true;
    }

    function placeMarker(lat, lng) {
        const isValid = isInsideTacloban(lat, lng);
        
        if (!isValid) {
            updateLocationStatus(false);
            return;
        }
        
        if (marker) {
            map.removeLayer(marker);
        }
        
        // The same draggable pin as every other DEVTech map.
        marker = L.marker([lat, lng], { icon: devtechPinIcon(), draggable: true, title: 'Service location' }).addTo(map);
        marker.on('dragend', function () {
            const pos = marker.getLatLng();
            placeMarker(pos.lat, pos.lng);
        });
        document.getElementById('pinnedLat').value = lat;
        document.getElementById('pinnedLng').value = lng;
        
        // Update status
        updateLocationStatus(true);
        
        // Update pin result text
        const pinText = document.getElementById('pinResultText');
        pinText.textContent = `📍 Location pinned at ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        
        // Reverse geocode
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
            .then(response => response.json())
            .then(data => {
                if (data && data.display_name) {
                    document.getElementById('serviceAddress').value = data.display_name;
                    pinText.textContent = `📍 ${data.display_name.substring(0, 60)}...`;
                }
            })
            .catch(error => {
                console.error('Error getting address:', error);
            });
        
        updateSummary();
    }

    function getUserLocation() {
        if (navigator.geolocation) {
            showUserToast('📍 Getting your location...', 'info');
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    if (isInsideTacloban(lat, lng)) {
                        map.setView([lat, lng], 15);
                        placeMarker(lat, lng);
                    } else {
                        updateLocationStatus(false);
                        showUserToast('❌ Your location is outside Tacloban City. Please select a location within the city.', 'error');
                    }
                },
                function(error) {
                    showUserToast('Unable to get your location. Please click on the map.', 'error');
                }
            );
        } else {
            showUserToast('Geolocation is not supported by your browser.', 'error');
        }
    }

    function searchLocation() {
        const address = document.getElementById('mapSearchInput').value;
        if (!address) {
            showUserToast('Please enter an address to search.', 'warning');
            return;
        }
        
        showUserToast('Searching for address...', 'info');
        
        // Add "Tacloban City" to the search query to prioritize local results
        const searchQuery = `${address}, Tacloban City, Philippines`;
        
        // Limited to the Tacloban service area (same box the server checks).
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=1&countrycodes=ph&bounded=1&viewbox=124.88,11.18,125.05,11.36`)
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);
                    
                    if (isInsideTacloban(lat, lng)) {
                        map.setView([lat, lng], 15);
                        placeMarker(lat, lng);
                        document.getElementById('serviceAddress').value = data[0].display_name;
                    } else {
                        updateLocationStatus(false);
                        showUserToast('❌ This address is outside Tacloban City. Please search within the city boundary.', 'error');
                    }
                } else {
                    showUserToast('Address not found in Tacloban City. Please try again.', 'error');
                }
            })
            .catch(error => {
                showUserToast('Error searching address.', 'error');
            });
    }

    function resetMap() {
        if (marker) {
            map.removeLayer(marker);
            marker = null;
        }
        document.getElementById('pinnedLat').value = '';
        document.getElementById('pinnedLng').value = '';
        document.getElementById('isValidLocation').value = '0';
        document.getElementById('mapPinResult').classList.remove('show', 'valid', 'invalid');
        document.getElementById('boundaryWarning').classList.remove('show');
        document.getElementById('locationValid').classList.remove('show');
        isLocationValid = false;
        updateSubmitButtons();
        showUserToast('🗺️ Map reset', 'info');
    }

    function toggleAddress() {
        const inShop = document.getElementById('inShopCheck').checked;
        const addressInput = document.getElementById('serviceAddress');
        const mapSection = document.getElementById('mapSection');
        
        const shopCard = document.getElementById('shopCard');
        if (shopCard) {
            shopCard.hidden = !inShop;
            if (inShop && window.DevtechMapView) setTimeout(() => DevtechMapView.render(shopCard), 50);
        }
        if (inShop) {
            mapSection.style.display = 'none';
            addressInput.removeAttribute('required');
            addressInput.value = 'In-shop repair at our downtown shop';
            // Enable submit buttons for in-shop repair
            document.getElementById('isValidLocation').value = '1';
            isLocationValid = true;
            showUserToast('🏪 In-shop repair selected', 'info');
        } else {
            mapSection.style.display = 'block';
            addressInput.setAttribute('required', 'required');
            addressInput.value = '';
            document.getElementById('isValidLocation').value = '0';
            isLocationValid = false;
            setTimeout(() => {
                if (map) {
                    map.invalidateSize();
                } else {
                    initMap();
                }
            }, 300);
        }
        updateSubmitButtons();
        updateSummary();
    }

    // ============================================
    // SUMMARY UPDATE
    // ============================================

    // Starting price minus the booking fee paid now (the fee is deducted from the final bill).
function setBalance(price) {
    const box = document.querySelector('.bk-fee');
    const out = document.getElementById('summaryBalance');
    if (!box || !out) return;
    const balance = Math.max(price - (parseFloat(box.dataset.fee) || 0), 0);
    out.textContent = `₱${balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
}

function updateSummary() {
        // Device
        const deviceRadios = document.querySelectorAll('input[name="device_type"]');
        let device = 'Laptop';
        let customDevice = '';
        deviceRadios.forEach(radio => {
            if (radio.checked) {
                device = radio.value;
                if (device === 'Other') {
                    customDevice = document.getElementById('custom_device')?.value || 'Not specified';
                }
            }
        });
        const brandModel = [document.getElementById('device_brand')?.value.trim(),
                            document.getElementById('device_model')?.value.trim()].filter(Boolean).join(' ');
        document.getElementById('summaryDevice').textContent =
            (device === 'Other' ? `Other: ${customDevice}` : device) + (brandModel ? ` · ${brandModel}` : '');

        // Service
        const serviceSelect = document.getElementById('service_id');
        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        if (selectedOption && selectedOption.value) {
            let serviceName = selectedOption.text;
            const price = selectedOption.dataset.price || '0';
            document.getElementById('summaryService').textContent = serviceName.split(' - ')[0];
            document.getElementById('summaryPrice').textContent = parseFloat(price) > 0
                ? `₱${parseFloat(price).toLocaleString(undefined, {minimumFractionDigits: 2})}`
                : 'Price upon diagnosis';
            setBalance(parseFloat(price) || 0);
        } else {
            document.getElementById('summaryService').textContent = 'Not selected';
            document.getElementById('summaryPrice').textContent = '₱0.00';
            setBalance(0);
        }

        // Issue
        const issueText = document.getElementById('problemDesc').value;
        document.getElementById('summaryIssue').textContent = issueText || 'Not described yet';
        document.getElementById('summaryIssue').className = issueText ? '' : 'user-summary-placeholder';

        // Location
        const inShop = document.getElementById('inShopCheck').checked;
        const address = document.getElementById('serviceAddress').value;
        document.getElementById('summaryAddress').textContent = inShop ? 'In-shop repair, downtown shop' : (address || 'Not set');

        // Schedule
        const date = document.getElementById('bookingDate').value;
        const time = document.getElementById('bookingTime').value;
        if (date && time) {
            const formattedDate = formatDate(date);
            document.getElementById('summarySchedule').textContent = `${formattedDate} at ${time}`;
            document.getElementById('summarySchedule').className = '';
        } else {
            document.getElementById('summarySchedule').textContent = 'Not set';
            document.getElementById('summarySchedule').className = 'user-summary-placeholder';
        }

        // Payment
        updatePaymentInfo();
    }

    // ============================================
    // CHARACTER COUNT
    // ============================================

    document.addEventListener('DOMContentLoaded', function() {
        const textarea = document.getElementById('problemDesc');
        if (textarea) {
            textarea.addEventListener('input', function() {
                const count = this.value.length;
                document.getElementById('charCount').textContent = count;
                if (count > 500) {
                    this.value = this.value.substring(0, 500);
                    document.getElementById('charCount').textContent = 500;
                }
                updateSummary();
            });
        }

        // Service selection change
        const serviceSelect = document.getElementById('service_id');
        if (serviceSelect) {
            serviceSelect.addEventListener('change', function() {
                const customGroup = document.getElementById('customServiceGroup');
                if (this.value === 'other') {
                    customGroup.style.display = 'block';
                    document.getElementById('custom_service').setAttribute('required', 'required');
                } else {
                    customGroup.style.display = 'none';
                    document.getElementById('custom_service').removeAttribute('required');
                }
                showServiceInfo();
                updateSummary();
            });
            showServiceInfo();          // a service pre-selected from the catalog
        }
        ['device_brand', 'device_model'].forEach(function (id) {
            document.getElementById(id)?.addEventListener('input', updateSummary);
        });

        // What the chosen service covers, its price and typical time.
        function showServiceInfo() {
            const box = document.getElementById('serviceInfo');
            const opt = serviceSelect.options[serviceSelect.selectedIndex];
            if (!box || !opt || !opt.value || opt.value === 'other') { if (box) box.hidden = true; return; }
            const price = parseFloat(opt.dataset.price || '0'), hours = parseInt(opt.dataset.hours || '1', 10);
            document.getElementById('serviceInfoText').textContent = opt.dataset.description || '';
            document.getElementById('serviceInfoPrice').textContent = price > 0
                ? `Starts at ₱${price.toLocaleString(undefined, {minimumFractionDigits: 2})}`
                : 'Price upon diagnosis';
            document.getElementById('serviceInfoHours').textContent =
                `Typically about ${hours} hour${hours === 1 ? '' : 's'} of work`;
            box.hidden = false;
        }

        // Only services offered for the chosen device are listed ("Other" shows all).
        const DEVICE_KEYS = {'Laptop': 'laptop', 'Desktop PC': 'desktop', 'Tablet': 'tablet', 'Smartphone': 'smartphone',
                             'Monitor': 'monitor', 'Storage Device': 'storage'};
        function filterServicesByDevice() {
            if (!serviceSelect) return;
            const checked = document.querySelector('input[name="device_type"]:checked');
            const key = checked ? DEVICE_KEYS[checked.value] : null;
            let shown = 0;
            Array.from(serviceSelect.options).forEach(opt => {
                if (!opt.value || opt.value === 'other') return;
                const devices = (opt.dataset.devices || '').split(',').filter(Boolean);
                const fits = !key || !devices.length || devices.includes(key);
                opt.hidden = opt.disabled = !fits;
                if (fits) shown++;
            });
            const current = serviceSelect.options[serviceSelect.selectedIndex];
            if (current && current.disabled) {
                serviceSelect.value = '';
                showServiceInfo();
                showUserToast(`That service isn't offered for a ${checked.value.toLowerCase()}. Please choose another.`, 'warning');
            }
            let note = document.getElementById('serviceDeviceNote');
            if (!note) {
                note = document.createElement('small');
                note.id = 'serviceDeviceNote';
                note.className = 'user-field-hint';
                serviceSelect.insertAdjacentElement('afterend', note);
            }
            note.textContent = key ? `${shown} service${shown === 1 ? '' : 's'} for ${checked.value.toLowerCase()}s` : '';
            updateSummary();
        }
        filterServicesByDevice();

        // The description must be a real sentence about the problem (same rule as the server).
        function descriptionProblem(text) {
            const t = (text || '').trim();
            const words = t.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || [];
            if (t.length < 15 || words.length < 3) return 'Describe what the device does in a full sentence.';
            const junk = words.filter(w => {
                const x = w.toLowerCase();
                if (x.length < 4) return false;
                const vowels = (x.match(/[aeiouy]/g) || []).length;
                return vowels === 0 || vowels / x.length < 0.2 || /[^aeiouy]{5,}/.test(x) || /(.)\1{3,}/.test(x)
                    || ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].some(r => r.includes(x));
            });
            if (junk.length * 3 >= words.length) return 'This looks like random letters. Tell us what happens and when it started.';
            return '';
        }
        const desc = document.getElementById('problemDesc');
        const descHint = document.getElementById('problemDescHint');
        function checkDescription(show) {
            const problem = descriptionProblem(desc.value);
            desc.setCustomValidity(problem);
            if (show || !problem) {
                descHint.innerHTML = problem
                    ? '<i class="fas fa-circle-exclamation"></i> ' + problem
                    : '<i class="fas fa-circle-check"></i> Clear enough for the technician';
                descHint.classList.toggle('is-error', !!problem);
                descHint.classList.toggle('is-ok', !problem);
            }
        }
        if (desc) {
            desc.addEventListener('blur', () => checkDescription(true));
            desc.addEventListener('input', () => checkDescription(desc.classList.contains('touched') || !descriptionProblem(desc.value)));
            desc.addEventListener('blur', () => desc.classList.add('touched'));
            document.getElementById('charCount').textContent = desc.value.length;
            if (desc.value) checkDescription(true);
        }

        // Device radio change
        document.querySelectorAll('input[name="device_type"]').forEach(radio => {
            radio.addEventListener('change', filterServicesByDevice);
            radio.addEventListener('change', function() {
                const customGroup = document.getElementById('customDeviceGroup');
                if (this.value === 'Other') {
                    customGroup.style.display = 'block';
                    document.getElementById('custom_device').setAttribute('required', 'required');
                } else {
                    customGroup.style.display = 'none';
                    document.getElementById('custom_device').removeAttribute('required');
                }
                updateSummary();
            });
        });

        // Custom device input
        const customDevice = document.getElementById('custom_device');
        if (customDevice) {
            customDevice.addEventListener('input', updateSummary);
        }

        // Custom service input
        const customService = document.getElementById('custom_service');
        if (customService) {
            customService.addEventListener('input', updateSummary);
        }

        // Date change
        const bookingDate = document.getElementById('bookingDate');
        if (bookingDate) {
            bookingDate.addEventListener('change', function() {
                const date = this.value;
                if (date) {
                    fetchBookedSlots(date).then(() => {
                        updateTimeSlots(date);
                    });
                } else {
                    resetTimeSlotsToDefault();
                }
                updateSummary();
            });
        }

        // Time slot clicks
        document.querySelectorAll('.user-time-slot').forEach(slot => {
            slot.addEventListener('click', function(e) {
                if (this.classList.contains('lunch')) {
                    showUserToast('🍽️ This is lunch break. Please select another time.', 'warning');
                    e.stopPropagation();
                    return;
                }

                if (this.classList.contains('past')) {
                    showUserToast('⏰ This time slot has already passed. Please select another time.', 'warning');
                    e.stopPropagation();
                    return;
                }

                if (this.classList.contains('booked')) {
                    showUserToast('❌ This time slot is fully booked (5/5). Please select another time.', 'error');
                    e.stopPropagation();
                    return;
                }

                const date = document.getElementById('bookingDate').value;
                if (!date) {
                    showUserToast('📅 Please select a date first.', 'warning');
                    e.stopPropagation();
                    return;
                }

                const time = this.dataset.time;
                document.querySelectorAll('.user-time-slot').forEach(s => s.classList.remove('selected'));
                this.classList.add('selected');
                document.getElementById('bookingTime').value = time;
                const count = getBookedCount(date, time);
                showUserToast(`⏰ Selected: ${this.querySelector('span:first-child')?.textContent || time} (${count}/5 booked)`, 'success');
                updateSummary();
            });
        });

        // Address input
        const addressInput = document.getElementById('serviceAddress');
        if (addressInput) {
            addressInput.addEventListener('input', updateSummary);
        }

        // Payment method change
        document.querySelectorAll('input[name="payment_method"]').forEach(radio => {
            radio.addEventListener('change', updateSummary);
        });

        // Initialize map if not in-shop
        const inShopCheck = document.getElementById('inShopCheck');
        if (inShopCheck && !inShopCheck.checked) {
            setTimeout(() => {
                initMap();
            }, 500);
        }
        
        // Initial submit button state
        updateSubmitButtons();
    });

    // ============================================
    // RESET FORM
    // ============================================

    function resetForm() {
        if (!confirm('Are you sure you want to clear all form fields?')) return;
        
        document.getElementById('bookingForm').reset();
        document.getElementById('customServiceGroup').style.display = 'none';
        document.getElementById('customDeviceGroup').style.display = 'none';
        document.getElementById('custom_service').value = '';
        document.getElementById('custom_device').value = '';
        document.getElementById('bookingTime').value = '';
        document.getElementById('charCount').textContent = '0';
        
        resetTimeSlotsToDefault();
        
        if (marker) {
            map.removeLayer(marker);
            marker = null;
        }
        document.getElementById('pinnedLat').value = '';
        document.getElementById('pinnedLng').value = '';
        document.getElementById('isValidLocation').value = '0';
        document.getElementById('mapPinResult').classList.remove('show', 'valid', 'invalid');
        document.getElementById('boundaryWarning').classList.remove('show');
        document.getElementById('locationValid').classList.remove('show');
        isLocationValid = false;
        
        updateSubmitButtons();
        updateSummary();
        showUserToast('🗑️ Form has been cleared', 'info');
    }

    // ============================================
    // SUBMIT BOOKING
    // ============================================

    function submitBooking() {
        const form = document.getElementById('bookingForm');
        const date = document.getElementById('bookingDate').value;
        const time = document.getElementById('bookingTime').value;
        const service = document.getElementById('service_id').value;
        const issue = document.getElementById('problemDesc').value;
        const inShop = document.getElementById('inShopCheck').checked;
        const address = document.getElementById('serviceAddress').value;
        const isValidLocation = document.getElementById('isValidLocation').value;
        
        if (!service || service === '') {
            showUserToast('Please select a service.', 'error');
            return;
        }
        
        if (!date) {
            showUserToast('Please select a date.', 'error');
            return;
        }
        
        if (!time) {
            showUserToast('Please select a time slot.', 'error');
            return;
        }
        
        if (!issue.trim()) {
            showUserToast('Please describe the issue.', 'error');
            return;
        }
        
        if (!inShop && !address) {
            showUserToast('Please enter your address or select in-shop repair.', 'error');
            return;
        }
        
        // Check if location is valid for home service
        if (!inShop && isValidLocation !== '1') {
            showUserToast('❌ Please pin a valid location within Tacloban City on the map.', 'error');
            document.getElementById('mapSection').scrollIntoView({ behavior: 'smooth' });
            return;
        }
        
        // Check if time slot is full
        if (isSlotBooked(date, time)) {
            showUserToast('❌ This time slot is fully booked (5/5). Please select another time.', 'error');
            fetchBookedSlots(date).then(() => {
                updateTimeSlots(date);
            });
            return;
        }
        
        // Check if time slot is past
        if (isSlotPast(date, time)) {
            showUserToast('⏰ This time slot has already passed. Please select another time.', 'error');
            updateTimeSlots(date);
            return;
        }
        
        const terms = document.getElementById('acceptTerms');
        if (terms && !terms.checked) {
            showUserToast('Please read and accept the Terms of Service.', 'error');
            terms.closest('.user-form-step').scrollIntoView({ behavior: 'smooth', block: 'center' });
            terms.focus();
            return;
        }

        // Submit once: a double click must not create two bookings.
        ['submitBtn', 'summarySubmitBtn'].forEach(id => {
            const b = document.getElementById(id);
            if (b) b.disabled = true;
        });
        form.submit();
    }

    // The form's own Submit button skips submitBooking(); guard it the same way.
    document.getElementById('bookingForm')?.addEventListener('submit', function () {
        ['submitBtn', 'summarySubmitBtn'].forEach(id => {
            const b = document.getElementById(id);
            if (b) setTimeout(() => { b.disabled = true; }, 0);
        });
    });

    // ============================================
    // FLASH MESSAGE CLOSE
    // ============================================
    
    document.querySelectorAll('.flash-close').forEach(btn => {
        btn.addEventListener('click', function() {
            this.parentElement.remove();
        });
    });

    setTimeout(() => {
        document.querySelectorAll('.flash-message').forEach(msg => {
            msg.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            msg.style.opacity = '0';
            msg.style.transform = 'translateY(-20px)';
            setTimeout(() => {
                if (msg.parentElement) msg.remove();
            }, 500);
        });
    }, 5000);


    console.log('✅ Booking system initialized with Tacloban City geofencing');

    // Publish what the page's buttons call. Re-applied after load so these win
    // over user.js's generic functions of the same name, which load later.
    const handlers = { getUserLocation, resetForm, resetMap, searchLocation, submitBooking, toggleAddress };
    Object.assign(window, handlers);
    document.addEventListener('DOMContentLoaded', function () { Object.assign(window, handlers); });
})();
</script>
